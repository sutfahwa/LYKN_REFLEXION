<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คำถามที่พบบ่อย — LYKN Reflexion Concert</title>
<meta name="description" content="LYKN Reflexion Concert — 24-25 ตุลาคม 2569 ณ อิมแพ็ค อารีน่า เมืองทองธานี รายละเอียดบัตร ผังที่นั่ง และกำหนดการ">
<link rel="icon" type="image/png" sizes="32x32" href="https://cdn.jsdelivr.net/gh/sutfahwa/LYKN_REFLEXION@main/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="https://cdn.jsdelivr.net/gh/sutfahwa/LYKN_REFLEXION@main/assets/favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://cdn.jsdelivr.net/gh/sutfahwa/LYKN_REFLEXION@main/assets/favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="https://cdn.jsdelivr.net/gh/sutfahwa/LYKN_REFLEXION@main/assets/favicon-512.png">
<link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/sutfahwa/LYKN_REFLEXION@main/assets/favicon.ico">
<link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/sutfahwa/LYKN_REFLEXION@main/assets/apple-touch-icon.png">
<meta property="og:title" content="LYKN Reflexion Concert">
<meta property="og:description" content="24-25 ตุลาคม 2569 ณ อิมแพ็ค อารีน่า เมืองทองธานี">
<meta property="og:image" content="https://cdn.jsdelivr.net/gh/sutfahwa/LYKN_REFLEXION@main/assets/logo.png">
<meta property="og:type" content="website">
<script>
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:') {
    var robotsMeta = document.createElement('meta');
    robotsMeta.name = 'robots';
    robotsMeta.content = 'noindex, nofollow';
    document.head.appendChild(robotsMeta);
    document.title = '[TEST] ' + document.title;
  }
</script>
<script src="https://cdn.jsdelivr.net/gh/sutfahwa/LYKN_REFLEXION@main/support.js"></script>
<script src="/shared/nav.js"></script>
<script src="/shared/translations.js"></script>
</head>
<body>
<x-dc>

<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/base.css">
</helmet>

<div style="min-height:100vh;background:#000000;color:#f2f7f6;padding-bottom:40px">

  <nav style="display:flex;position:fixed;top:0;left:0;right:0;z-index:50;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(5,13,16,0.88);backdrop-filter:blur(8px);border-bottom:1px solid rgba(111,224,214,0.15)">
    <a href="/index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none">
      <img src="https://cdn.jsdelivr.net/gh/sutfahwa/LYKN_REFLEXION@main/assets/lykn-nav-logo.png" alt="LYKN" style="height:36px;cursor:pointer;display:block">
      <span style="color:#eafffb;font-size:14px;font-weight:600">{{ homeLabel }}</span>
    </a>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="position:relative">
        <button type="button" class="hamburger-btn" onClick="{{ toggleMenu }}" aria-label="Menu" style="width:38px;height:38px;border-radius:8px;border:1px solid rgba(111,224,214,0.25);background:rgba(255,255,255,0.06);color:#eafffb;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit">☰</button>
        <sc-if value="{{ isMenuOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position:fixed;inset:0;z-index:59" onClick="{{ closeMenu }}"></div>
          <div style="position:absolute;top:calc(100% + 8px);right:0;z-index:60;background:#0c2226;border:1px solid rgba(111,224,214,0.3);border-radius:12px;padding:6px;min-width:210px;box-shadow:0 14px 30px rgba(0,0,0,0.5)">
            <sc-for list="{{ menuItems }}" as="item" hint-placeholder-count="5">
              <a href="{{ item.href }}" class="menu-item" style="display:block;padding:11px 14px;border-radius:8px;font-size:14.5px;font-weight:500;background:{{ item.bg }};color:{{ item.color }};text-decoration:none">{{ item.label }}</a>
            </sc-for>
          </div>
        </sc-if>
      </div>
      <div style="position:relative">
        <button type="button" class="hamburger-btn" onClick="{{ toggleLangMenu }}" aria-label="Language" style="display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:8px;border:1px solid rgba(111,224,214,0.25);background:rgba(255,255,255,0.06);color:#eafffb;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">
          <span style="font-size:15px">{{ langSelector.currentFlag }}</span>
          <span>{{ langSelector.currentShortLabel }}</span>
          <span style="font-size:9px;color:#8ea6a3">▼</span>
        </button>
        <sc-if value="{{ isLangMenuOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position:fixed;inset:0;z-index:59" onClick="{{ closeLangMenu }}"></div>
          <div style="position:absolute;top:calc(100% + 8px);right:0;z-index:60;background:#0c2226;border:1px solid rgba(111,224,214,0.3);border-radius:12px;padding:6px;min-width:170px;box-shadow:0 14px 30px rgba(0,0,0,0.5)">
            <sc-for list="{{ langSelector.options }}" as="opt" hint-placeholder-count="2">
              <div onClick="{{ opt.onClick }}" class="menu-item" style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;background:{{ opt.bg }};color:{{ opt.color }}">
                <span style="font-size:16px">{{ opt.flag }}</span>
                <span>{{ opt.label }}</span>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </div>
  </nav>

  <main style="padding-top:66px;max-width:1100px;margin:0 auto">

    <section style="padding:28px 20px 60px">
      <h1 style="font-size:30px;font-weight:700;margin:0 0 20px">{{ t.faq.title }}</h1>
      <input type="text" value="{{ faqSearch }}" onChange="{{ setFaqSearch }}" placeholder="{{ t.faq.searchPlaceholder }}" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(111,224,214,0.3);color:#f2f7f6;font-size:14.5px;padding:12px 16px;border-radius:10px;margin-bottom:20px;outline:none;font-family:'Noto Sans Thai',sans-serif">
      <sc-if value="{{ hasFaqResults }}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{ filteredFaqs }}" as="f" hint-placeholder-count="6">
          <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:18px 20px;margin-bottom:12px">
            <div style="font-weight:600;font-size:15.5px;color:#6fe0d6;margin-bottom:8px">{{ f.q }}</div>
            <div style="font-size:14.5px;color:#dcece9;line-height:1.7">{{ f.a }}</div>
          </div>
        </sc-for>
      </sc-if>
      <sc-if value="{{ noFaqResults }}" hint-placeholder-val="{{ false }}">
        <div style="text-align:center;padding:32px 20px;color:#8ea6a3;font-size:14.5px">{{ t.faq.noResultsPrefix }}{{ faqSearch }}{{ t.faq.noResultsSuffix }}</div>
      </sc-if>
    </section>

  </main>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  state = {
    lang: getStoredLang(),
    faqSearch: '',
    openDropdown: null
  };

  setLang(lang) {
    if (lang === this.state.lang) return;
    setStoredLang(lang);
    this.setState({ lang, openDropdown: null });
    document.documentElement.lang = lang;
  }

  toggleDropdown(key) { this.setState({ openDropdown: this.state.openDropdown === key ? null : key }); }
  closeDropdown() { this.setState({ openDropdown: null }); }

  renderVals() {
    const en = this.state.lang === 'en';
    const faqQuery = this.state.faqSearch.trim().toLowerCase();
    const filteredFaqs = faqData(en).filter(f =>
      !faqQuery || f.q.toLowerCase().includes(faqQuery) || f.a.toLowerCase().includes(faqQuery)
    );

    return {
      menuItems: buildMenuItems('faq', en),
      isMenuOpen: this.state.openDropdown === 'mainMenu',
      toggleMenu: () => this.toggleDropdown('mainMenu'),
      closeMenu: () => this.closeDropdown(),
      homeLabel: homeLabel(en),
      langSelector: buildLangSelector(en, (lang) => this.setLang(lang)),
      isLangMenuOpen: this.state.openDropdown === 'langMenu',
      toggleLangMenu: () => this.toggleDropdown('langMenu'),
      closeLangMenu: () => this.closeDropdown(),
      t: buildTranslations(en),
      faqSearch: this.state.faqSearch,
      setFaqSearch: (e) => this.setState({ faqSearch: e.target.value }),
      filteredFaqs,
      hasFaqResults: filteredFaqs.length > 0,
      noFaqResults: filteredFaqs.length === 0
    };
  }
}

</script>
</body>
</html>
