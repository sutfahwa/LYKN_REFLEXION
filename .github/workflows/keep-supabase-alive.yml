name: Keep Supabase Alive

# ปิ้ง seat-check ทุกสัปดาห์เพื่อกัน Supabase free tier auto-pause
# โปรเจกต์หลัง 7 วันไม่มี request เข้าฐานข้อมูลเลย (คอนยังไม่ถึงต.ค. 2569
# เว็บยังไม่มี traffic จริง เสี่ยงโดน pause ถ้าไม่มีอะไรไปกระตุ้นเป็นระยะ)
on:
  schedule:
    - cron: '0 3 * * 1' # ทุกวันจันทร์ 03:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping seat-check endpoint
        run: |
          curl -s -X POST "https://xyqbvgbtspcjkyioxeiu.supabase.co/functions/v1/seat-check" \
            -H "Content-Type: application/json" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -d '{"show_id":"keepalive","zone":"x","row":"x","seat":"x","seller_handle":"x"}'
